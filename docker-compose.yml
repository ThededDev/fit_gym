version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fitgym-postgres
    environment:
      POSTGRES_USER: fitgym
      POSTGRES_PASSWORD: fitgym123
      POSTGRES_DB: fitgym
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitgym"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

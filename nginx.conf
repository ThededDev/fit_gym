# ONE FitGym — Nginx/OpenResty configuration for TatNet hosting
#
# PROBLEM: 405 errors on POST/PATCH/DELETE requests
# CAUSE: OpenResty/Nginx serves static files for ALL routes by default.
#        POST/PATCH/DELETE to static files = 405 Method Not Allowed from Nginx.
# FIX: Define /api/ location BEFORE / location so API requests reach Node.js.
#
# INSTRUCTIONS:
# 1. Place this config (or include it) in your TatNet OpenResty server block
# 2. Replace "your-domain.com" with your actual domain
# 3. Replace "/path/to/dist" with the actual path to your dist directory on TatNet
# 4. Make sure the /api/ location block appears BEFORE the / location block
#    (Nginx matches the most specific location first for same-prefix patterns,
#    but order matters for regex locations)

upstream nodejs_backend {
    server 127.0.0.1:8787;
    keepalive 64;
}

server {
    listen 80;
    server_name your-domain.com;  # <-- Replace with your actual domain

    # ============================================================
    # API requests — proxy to Node.js backend
    # THIS MUST BE DEFINED BEFORE the / location block
    # ============================================================
    location /api/ {
        proxy_pass http://nodejs_backend/api/;
        proxy_http_version 1.1;

        # Pass original request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CORS preflight — respond directly at Nginx level (faster)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        # CORS headers on proxied responses
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    }

    # ============================================================
    # Static files (React SPA build output)
    # ============================================================
    location / {
        root /path/to/dist;  # <-- Replace with actual path to dist on TatNet
        index index.html;

        # SPA routing: serve index.html for all non-file routes
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
